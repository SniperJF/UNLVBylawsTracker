<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="img/logo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Ticket — UNLV Bylaws Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body class="app-layout">

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/BylawsTracker/" class="nav-brand">
      <img src="img/logo.png" alt="" style="width:30px;height:30px;border-radius:7px;object-fit:cover;">
      Bylaws Tracker<span class="dot">.</span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html" data-page="dashboard">Dashboard</a>
      <a href="new-ticket.html" data-page="new">+ New Ticket</a>
      <a href="admin.html" data-page="admin" data-admin>Admin</a>
    </div>
    <div class="nav-right">
      <a href="notifications.html" class="notif-btn" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge hidden" id="notif-badge"></span>
      </a>
      <div class="user-menu">
        <button class="user-btn" id="user-btn">
          <span id="nav-user-name"></span>
          <span class="role-tag" id="nav-role"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <a href="profile.html">Change Password</a>
          <button class="danger" id="logout-btn">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="page-wrap">
  <div style="max-width:680px;margin:0 auto;">
    <div class="page-header">
      <a href="dashboard.html" class="text-muted text-sm" style="text-decoration:none;">← Back to Dashboard</a>
      <div class="section-title" style="margin-top:8px;">New Ticket</div>
    </div>

    <div id="alert-area"></div>

    <div class="card">
      <form id="ticket-form">
        <div class="form-group">
          <label>Track / Type *</label>
          <select class="form-control" id="type" required>
            <option value="university_amendment">Track A — University Bylaws Amendment</option>
            <option value="unit_bylaws">Track B — Unit Bylaws (College/Department)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title *</label>
          <input type="text" class="form-control" id="title" placeholder="Brief descriptive title" required>
        </div>
        <div class="form-group">
          <label>Bylaws Section</label>
          <input type="text" class="form-control" id="bylaws_section" placeholder="e.g. Ch.2 §10.4, Article III">
        </div>
        <div id="unit-field" class="form-group hidden">
          <label>Unit Name</label>
          <input type="text" class="form-control" id="unit_name" placeholder="e.g. College of Engineering, Dept. of CS">
        </div>
        <div class="form-group">
          <label>Description / Amendment Summary</label>
          <textarea class="form-control" id="description" placeholder="Describe the amendment, what changes, and why…" style="min-height:140px;"></textarea>
        </div>
        <div class="form-group">
          <label>Assign To</label>
          <select class="form-control" id="assignee_id">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="form-group">
          <label>Attachments <span style="font-weight:400;text-transform:none;color:var(--muted)">(PDF, DOCX, TXT — max 20MB each)</span></label>
          <input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.txt,.png,.jpg" style="color:var(--text);background:var(--panel);border:1px solid var(--border);padding:8px;border-radius:8px;width:100%;">
        </div>
        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary" id="submit-btn">Create Ticket</button>
          <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
requireLogin();
renderNav('new');

document.getElementById('user-btn').addEventListener('click', () => document.getElementById('user-dropdown').classList.toggle('open'));
document.addEventListener('click', e => { if (!e.target.closest('.user-menu')) document.getElementById('user-dropdown').classList.remove('open'); });
document.getElementById('logout-btn').addEventListener('click', () => { clearAuth(); window.location.href = 'login.html'; });

// Show unit name field for unit_bylaws
document.getElementById('type').addEventListener('change', (e) => {
  document.getElementById('unit-field').classList.toggle('hidden', e.target.value !== 'unit_bylaws');
});

// Load users for assignee
apiFetch('/users').then(users => {
  const sel = document.getElementById('assignee_id');
  users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = `${u.name} (${u.role.replace(/_/g,' ')})`;
    sel.appendChild(opt);
  });
}).catch(() => {});

document.getElementById('ticket-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const alertArea = document.getElementById('alert-area');
  btn.disabled = true; btn.textContent = 'Creating…';
  alertArea.innerHTML = '';

  try {
    const ticket = await apiFetch('/tickets', {
      method: 'POST',
      body: JSON.stringify({
        type: document.getElementById('type').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        bylaws_section: document.getElementById('bylaws_section').value,
        unit_name: document.getElementById('unit_name').value,
        assignee_id: document.getElementById('assignee_id').value || null,
      })
    });

    // Upload files if any
    const files = document.getElementById('file-input').files;
    if (files.length > 0) {
      const fd = new FormData();
      for (const f of files) fd.append('files', f);
      await fetch(`/BylawsTracker/api/tickets/${ticket.id}/attachments`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${getToken()}` },
        body: fd,
      });
    }

    window.location.href = `ticket.html?id=${ticket.id}`;
  } catch (err) {
    alertArea.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Create Ticket';
  }
});
</script>
<footer class="site-footer">Built by <strong>FRG</strong> &nbsp;·&nbsp; UNLV Faculty Senate Bylaws Tracker</footer>
</body>
</html>
