<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="img/logo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — UNLV Bylaws Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="img/logo.png" alt="UNLV Bylaws Tracker" style="width:72px;height:72px;border-radius:14px;object-fit:cover;">
    </div>
    <div class="auth-title">Set New Password</div>
    <div id="alert-area"></div>
    <form id="reset-form">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" class="form-control" id="password" placeholder="Min 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" class="form-control" id="confirm" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" id="submit-btn">Set Password</button>
    </form>
    <div class="auth-footer"><a href="login.html">Back to login</a></div>
  </div>
</div>
<footer class="site-footer" style="position:fixed;bottom:0;left:0;right:0;padding:10px 20px;font-size:0.75rem;background:transparent;border:none;">Built by <a href="https://jorge-fonseca.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;"><strong>FRG</strong></a> &nbsp;·&nbsp; UNLV Faculty Senate</footer>

<script src="js/api.js"></script>
<script>
initTheme();

// Theme toggle for auth page
(function() {
  const btn = document.createElement('button');
  btn.id = 'theme-toggle-btn';
  btn.className = 'theme-toggle';
  btn.style.cssText = 'position:fixed;top:14px;right:16px;z-index:999;';
  btn.addEventListener('click', toggleTheme);
  document.body.appendChild(btn);
  _updateThemeIcon();
})();

const token = new URLSearchParams(location.search).get('token');
if (!token) document.getElementById('alert-area').innerHTML = '<div class="alert alert-error">Invalid or missing reset token.</div>';

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const alert = document.getElementById('alert-area');
  if (pw !== confirm) { alert.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>'; return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await apiFetch('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: pw }) });
    alert.innerHTML = '<div class="alert alert-success">Password updated! <a href="login.html">Sign in</a></div>';
    document.getElementById('reset-form').style.display = 'none';
  } catch (err) {
    alert.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Set Password';
  }
});
</script>
</body>
</html>
