<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — UNLV Bylaws Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box" style="text-align:center;">
    <div class="auth-logo">
      <img src="img/logo.png" alt="UNLV Bylaws Tracker" style="width:72px;height:72px;border-radius:14px;object-fit:cover;">
    </div>
    <div id="status-area"><div class="spinner" style="margin:20px auto;"></div><div class="text-muted mt-2">Verifying…</div></div>
  </div>
</div>
<footer class="site-footer" style="position:fixed;bottom:0;left:0;right:0;padding:10px 20px;font-size:0.75rem;background:transparent;border:none;">Built by <strong>FRG</strong> &nbsp;·&nbsp; UNLV Faculty Senate</footer>

<script src="js/api.js"></script>
<script>
initTheme();

// Theme toggle for auth page
(function() {
  const btn = document.createElement('button');
  btn.id = 'theme-toggle-btn';
  btn.className = 'theme-toggle';
  btn.style.cssText = 'position:fixed;top:14px;right:16px;z-index:999;';
  btn.addEventListener('click', toggleTheme);
  document.body.appendChild(btn);
  _updateThemeIcon();
})();

const token = new URLSearchParams(location.search).get('token');
const el = document.getElementById('status-area');
if (!token) {
  el.innerHTML = '<div class="alert alert-error">Invalid link.</div>';
} else {
  fetch('/BylawsTracker/api/auth/verify?token=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(d => {
      if (d.message) el.innerHTML = `<div class="alert alert-success">${d.message}</div><a href="login.html" class="btn btn-primary mt-3" style="margin-top:12px;">Go to Login</a>`;
      else el.innerHTML = `<div class="alert alert-error">${d.error || 'Verification failed.'}</div>`;
    }).catch(() => { el.innerHTML = '<div class="alert alert-error">Network error.</div>'; });
}
</script>
</body>
</html>
