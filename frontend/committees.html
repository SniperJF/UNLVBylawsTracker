<style>
.ask-box { display:flex; gap:10px; align-items:flex-end; }
.ask-box textarea { flex:1; resize:vertical; min-height:74px; }
.pick { border:1px solid var(--scarlet); border-radius:12px; padding:16px; background:var(--panel); margin-bottom:16px; }
.pick-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.pick h3 { margin:0; font-size:1.05rem; }
.pick-grp { font:.65rem/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--scarlet); margin-top:5px; }
.chair { display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:5px 13px; font-size:.84rem; }
.chair b { font-weight:700; }
.chair-mail { color:var(--scarlet); text-decoration:none; font-family:var(--mono); font-size:.78rem; }
.chair-mail:hover { text-decoration:underline; }
.ccard .chair { flex-wrap:wrap; max-width:100%; }
.answer { font-size:.95rem; line-height:1.65; }
.answer p { margin:0 0 9px; } .answer p:last-child { margin-bottom:0; }
.answer ul, .answer ol { margin:0 0 9px; padding-left:20px; }
.answer strong { font-weight:700; }
.cgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.ccard { border:1px solid var(--border); border-radius:10px; padding:13px; background:var(--panel); }
.ccard h4 { margin:0 0 3px; font-size:.92rem; }
.ccard .charge { font-size:.78rem; color:var(--muted); line-height:1.5; margin:7px 0; }
.ccard .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.76rem; }
.ex { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.ex button { border:1px solid var(--border); background:var(--panel); color:var(--muted); font-family:var(--font);
  font-size:.76rem; padding:6px 11px; border-radius:999px; cursor:pointer; }
.ex button:hover { border-color:var(--scarlet); color:var(--scarlet); }
</style>

          <span id="nav-user-name"></span>

<div class="page-wrap">
  <div class="page-header">
    <div class="section-title">Which Committee?</div>
    <div class="section-sub">Describe your issue and Padmé points you at the right Faculty Senate committee</div>
  </div>

  <div id="alert-area"></div>

  <!-- data-padme="off" — Padmé must not drive her own form -->
  <div class="card mb-4" data-padme="off">
    <div class="ask-box">
      <textarea class="form-control" id="q" maxlength="1000"
        placeholder="e.g. A faculty member wants to contest a promotion decision — who handles that?"></textarea>
      <button class="btn btn-primary" id="ask">Ask</button>
    </div>
    <div class="ex" id="examples"></div>
  </div>

  <div id="result"></div>

  <div class="page-header" style="margin-top:28px;">
    <div class="section-title" style="font-size:1.15rem;">All Committees</div>
    <div class="section-sub">Charge and chair pulled live from the Faculty Senate site</div>
  </div>
  <div id="dir"><div class="spinner" style="margin:30px auto;display:block;"></div></div>
</div>

<script src="js/api.js?v=ebb2f3c8a0"></script>
<script src="js/padme.js?v=f2b805fb63"></script>
<script>
requireLogin();
renderNav('committees');

document.getElementById('user-btn').addEventListener('click', () => document.getElementById('user-dropdown').classList.toggle('open'));
document.addEventListener('click', e => { if (!e.target.closest('.user-menu')) document.getElementById('user-dropdown').classList.remove('open'); });
document.getElementById('logout-btn').addEventListener('click', () => { clearAuth(); window.location.href = 'login.html'; });

const EXAMPLES = [
  'Who reviews a new degree program proposal?',
  'A faculty member wants to contest a promotion decision.',
  'We need to change wording in the Faculty Senate bylaws.',
  'Concerns about how AI is being used in grading.',
  'Who decides general education requirements?',
];

document.getElementById('examples').innerHTML =
  EXAMPLES.map(e => `<button data-q="${escHtml(e)}">${escHtml(e)}</button>`).join('');
document.querySelectorAll('#examples button').forEach(b => {
  b.addEventListener('click', () => { document.getElementById('q').value = b.dataset.q; ask(); });
});

// Shared light markdown renderer (same rules as the chat bubble).
function mdLite(src) {
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  let out = '', list = false;
  for (const raw of escHtml(src).split('\n')) {
    const line = raw.trim();
    if (!line) { if (list) { out += '</ul>'; list = false; } continue; }
    const li = line.match(/^[-*+]\s+(.*)$/);
    if (li) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { out += '</ul>'; list = false; }
    out += `<p>${inline(line)}</p>`;
  }
  if (list) out += '</ul>';
  return out;
}

const FS_EMAIL = 'Faculty.Senate@unlv.edu';

function chairPill(c) {
  // A placeholder like "Pending Committee Election" is not a person — never
  // present it as one. Give people somewhere to go rather than a dead end.
  if (!c.chair || /pending|election/i.test(c.chair)) {
    return `<span class="chair" style="color:var(--muted);">No chair listed — contact ` +
           `<a href="mailto:${FS_EMAIL}" class="chair-mail">${FS_EMAIL}</a></span>`;
  }
  const mail = c.chairEmail
    ? `<a href="mailto:${escHtml(c.chairEmail)}" class="chair-mail" title="Email ${escHtml(c.chair)}">${escHtml(c.chairEmail)}</a>`
    : '';
  return `<span class="chair">🪑 Chair: <b>${escHtml(c.chair)}</b>${mail ? ` · ${mail}` : ''}</span>`;
}

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('ask');
  const box = document.getElementById('result');
  btn.disabled = true; btn.textContent = 'Thinking…';
  box.innerHTML = '<div class="card"><div class="spinner" style="margin:10px auto;display:block;"></div></div>';
  try {
    const d = await apiFetch('/committees/ask', { method: 'POST', body: JSON.stringify({ question: q }) });
    const c = d.committee;
    box.innerHTML = `
      ${!c ? `<div class="pick" style="border-color:var(--border);">
        <div class="pick-top">
          <div>
            <h3>No committee matches this</h3>
            <div class="pick-grp">Try the Faculty Senate office</div>
          </div>
          <a class="btn btn-secondary btn-sm" href="mailto:${FS_EMAIL}">Email ${FS_EMAIL}</a>
        </div>
      </div>` : ''}
      ${c ? `<div class="pick">
        <div class="pick-top">
          <div>
            <h3>${escHtml(c.name)} Committee</h3>
            <div class="pick-grp">${escHtml(c.group)}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${chairPill(c)}
            <a class="btn btn-secondary btn-sm" href="${escHtml(c.url)}" target="_blank" rel="noopener">Committee page ↗</a>
          </div>
        </div>
        ${c.charge ? `<div class="text-sm text-muted" style="margin-top:11px;line-height:1.6;">${escHtml(c.charge)}</div>` : ''}
      </div>` : ''}
      <div class="card"><div class="answer">${mdLite(d.answer || '')}</div></div>`;
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Ask';
  }
}

document.getElementById('ask').addEventListener('click', ask);
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); }
});

async function loadDirectory() {
  try {
    const list = await apiFetch('/committees');
    const groups = {};
    list.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });
    document.getElementById('dir').innerHTML = Object.entries(groups).map(([g, cs]) => `
      <div style="margin-bottom:22px;">
        <div class="pick-grp" style="margin-bottom:9px;">${escHtml(g)}</div>
        <div class="cgrid">
          ${cs.map(c => `
            <div class="ccard">
              <h4>${escHtml(c.name)}</h4>
              <div class="charge">${c.charge ? escHtml(c.charge.slice(0, 190)) + (c.charge.length > 190 ? '…' : '') : 'Charge not published.'}</div>
              <div class="meta">
                ${chairPill(c)}
                <a href="${escHtml(c.url)}" target="_blank" rel="noopener" style="color:var(--scarlet);text-decoration:none;white-space:nowrap;">Open ↗</a>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('');
  } catch (err) {
    document.getElementById('dir').innerHTML = `<div class="alert alert-error">${escHtml(err.message)}</div>`;
  }
}

loadDirectory();
</script>
